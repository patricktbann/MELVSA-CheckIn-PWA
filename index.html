<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3768"><link rel="manifest" href="manifest.webmanifest"><title>MELVSA Check-In</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#102544}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0001;margin-bottom:16px}.brand{text-align:center}.brand h1{margin-bottom:4px}.brand p{margin-top:0;color:#607086}.btn{border:0;border-radius:12px;background:#0b3768;color:#fff;padding:14px 18px;font-weight:700;font-size:16px;margin:4px}.secondary{background:#607086}.status{margin:14px 0;padding:13px;border-radius:12px;background:#eef4fb}.ok{background:#eaf8ee}.bad{background:#fff0ed}.warn{background:#fff7dd}input,select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd6e2;border-radius:10px;margin:6px 0 12px;font-size:16px}label{font-weight:700;font-size:14px}video{width:100%;border-radius:14px;background:#111;min-height:260px}.small{font-size:13px;color:#607086}.hidden{display:none}.participant{line-height:1.6}.actions{text-align:center}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:140px}canvas{display:none}</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script></head><body><div class="wrap">
<div class="card brand"><h1>MELVSA Check-In</h1><p>Universal Activity Attendance Scanner</p><div id="status" class="status">Connecting to MELVSA Check-In service…</div></div>
<div id="loginCard" class="card"><h2>Staff Sign In</h2><label>Email or Mobile Number</label><input id="identifier" autocomplete="username" placeholder="Registered MELVSA admin email / mobile"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="actions"><button class="btn" id="loginBtn">Sign In</button></div><p class="small">Access requires an ACTIVE record with Can Check In = YES.</p></div>
<div id="appCard" class="card hidden"><div class="row"><div style="flex:1"><b id="userName"></b><div id="userRole" class="small"></div></div><button class="btn secondary" id="logoutBtn">Logout</button></div><hr><label>Activity</label><select id="activity"><option value="">Select activity…</option></select><div id="scanner" class="hidden"><video id="video" playsinline muted></video><canvas id="scanCanvas"></canvas><div class="row"><button class="btn" id="cameraBtn">Start Scanner</button><button class="btn secondary hidden" id="switchBtn">Switch Camera</button></div><p class="small">Cross-browser MELVSA QR scanner. Manual token remains available as operational fallback.</p></div><hr><label>Manual QR Token / Registration QR Value</label><input id="manual" placeholder="Paste or type QR token"><button class="btn" id="inspectBtn">Verify Participant</button></div>
<div id="participantCard" class="card hidden"><h2 id="resultTitle">Participant</h2><div id="resultMessage" class="status"></div><div id="participant" class="participant"></div><div class="actions"><button id="confirmBtn" class="btn hidden">Confirm Check-In</button><button id="cancelBtn" class="btn secondary">Clear</button></div></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzahYmfUPfCKi7FQQgm-n-4gyWvON_hEoDen7ZcbmNNqXYwyCMruzZAdA7hIYT7WWf-Ew/exec';let session=localStorage.getItem('melvsaCheckInSession')||'',stream=null,devices=[],deviceIndex=0,scanBusy=false,lastQr='',scanRunning=false,lastFrame=0;const $=id=>document.getElementById(id),status=$('status');function msg(t,k=''){status.className='status '+k;status.textContent=t}async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload}),redirect:'follow',cache:'no-store'});if(!r.ok)throw new Error('Backend HTTP '+r.status);const j=await r.json();if(!j.ok)throw new Error(j.error||'MELVSA backend rejected the request.');return j.data}
function showLogin(){session='';localStorage.removeItem('melvsaCheckInSession');$('loginCard').classList.remove('hidden');$('appCard').classList.add('hidden');$('participantCard').classList.add('hidden');stopCamera()}async function enterApp(s){session=s.token;localStorage.setItem('melvsaCheckInSession',session);$('loginCard').classList.add('hidden');$('appCard').classList.remove('hidden');$('userName').textContent=s.user.fullName||s.user.email;$('userRole').textContent=(s.user.role||'')+' • Check-In authorised';await loadActivities();msg('Signed in. Select an activity.','ok')}async function loadActivities(){const list=await api('activities',{token:session});const sel=$('activity');sel.innerHTML='<option value="">Select activity…</option>';list.forEach(a=>{const o=document.createElement('option');o.value=a.activityId;o.textContent=a.activityId+' — '+a.activityTitle+(a.startDate?' — '+a.startDate:'');sel.appendChild(o)})}
$('loginBtn').onclick=async()=>{try{msg('Signing in…');const identifier=$('identifier').value.trim(),password=$('password').value,lookup=await api('lookupUser',{identifier});const s=lookup.firstLogin?await api('createFirstPassword',{identifier,password}):await api('login',{identifier,password});await enterApp(s)}catch(e){msg(e.message,'bad')}};$('logoutBtn').onclick=async()=>{try{if(session)await api('logout',{token:session})}catch(e){}showLogin();msg('Signed out.')};$('activity').onchange=()=>{clearParticipant();if($('activity').value){$('scanner').classList.remove('hidden');msg('Activity selected. Start scanner or enter a token.','ok')}else{$('scanner').classList.add('hidden');stopCamera()}};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function participantHtml(p){if(!p)return '';return '<b>'+esc(p.fullName)+'</b><br>Registration: '+esc(p.registrationId)+'<br>Type: '+esc(p.participantType||'-')+'<br>Member ID: '+esc(p.memberId||'-')+'<br>Organisation: '+esc(p.organisation||'-')+'<br>Designation: '+esc(p.designation||'-')+'<br>Registration: '+esc(p.registrationStatus)+'<br>Check-In: '+esc(p.checkInStatus||'NOT CHECKED-IN')}
async function inspect(value){if(scanBusy)return;const activityId=$('activity').value;if(!activityId){msg('Select an activity first.','bad');return}value=(value||'').trim();if(!value){msg('No QR/token value detected.','bad');return}scanBusy=true;try{const r=await api('inspectQr',{token:session,activityId,qrInput:value});lastQr=value;$('participantCard').classList.remove('hidden');$('resultTitle').textContent=r.title||'Participant';$('resultMessage').className='status '+(r.code==='READY'?'ok':r.code==='ALREADY_CHECKED_IN'?'warn':'bad');$('resultMessage').textContent=r.message||'';$('participant').innerHTML=participantHtml(r.participant);$('confirmBtn').classList.toggle('hidden',r.code!=='READY');if(r.code==='READY')await stopCamera()}catch(e){msg(e.message,'bad');if(/session/i.test(e.message))showLogin()}finally{scanBusy=false}}
$('inspectBtn').onclick=()=>inspect($('manual').value);$('cancelBtn').onclick=()=>{clearParticipant();$('manual').value='';lastQr=''};$('confirmBtn').onclick=async()=>{try{const activityId=$('activity').value;if(!lastQr)throw new Error('No verified participant QR is pending.');$('confirmBtn').disabled=true;const r=await api('confirmCheckIn',{token:session,activityId,qrInput:lastQr,deviceInfo:navigator.userAgent});$('resultTitle').textContent=r.title;$('resultMessage').className='status '+(r.code==='SUCCESS'?'ok':'warn');$('resultMessage').textContent=r.message+(r.checkedInAt?' • '+r.checkedInAt:'');$('participant').innerHTML=participantHtml(r.participant);$('confirmBtn').classList.add('hidden');msg(r.code==='SUCCESS'?'Attendance recorded successfully.':r.message,r.code==='SUCCESS'?'ok':'warn')}catch(e){msg(e.message,'bad')}finally{$('confirmBtn').disabled=false}};function clearParticipant(){$('participantCard').classList.add('hidden');$('participant').innerHTML='';$('confirmBtn').classList.add('hidden')}
async function stopCamera(){scanRunning=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('cameraBtn').textContent='Start Scanner'}async function enumerate(){devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');$('switchBtn').classList.toggle('hidden',devices.length<2)}async function startCamera(deviceId){try{if(typeof jsQR!=='function')throw new Error('QR decoder did not load. Check internet connection and refresh.');await stopCamera();stream=await navigator.mediaDevices.getUserMedia({audio:false,video:deviceId?{deviceId:{exact:deviceId}}:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});$('video').srcObject=stream;await $('video').play();await enumerate();scanRunning=true;$('cameraBtn').textContent='Stop Scanner';msg('Scanner running — point camera at a MELVSA participant QR.','ok');requestAnimationFrame(scanLoop)}catch(e){msg('Scanner failed: '+(e.message||e),'bad')}}
function scanLoop(ts){if(!scanRunning||!stream)return;if(ts-lastFrame<120){requestAnimationFrame(scanLoop);return}lastFrame=ts;const v=$('video');if(v.readyState>=2&&v.videoWidth&&v.videoHeight){const c=$('scanCanvas'),ctx=c.getContext('2d',{willReadFrequently:true});const maxW=900,scale=Math.min(1,maxW/v.videoWidth);c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);ctx.drawImage(v,0,0,c.width,c.height);try{const im=ctx.getImageData(0,0,c.width,c.height),code=jsQR(im.data,im.width,im.height,{inversionAttempts:'dontInvert'});if(code&&code.data){msg('QR detected — verifying participant…','ok');inspect(code.data);return}}catch(e){}}requestAnimationFrame(scanLoop)}
$('cameraBtn').onclick=()=>scanRunning?stopCamera():startCamera();$('switchBtn').onclick=async()=>{if(!devices.length)await enumerate();deviceIndex=(deviceIndex+1)%devices.length;startCamera(devices[deviceIndex].deviceId)};(async()=>{try{await api('health',{});msg('MELVSA backend connected.','ok');if(session){try{const s=await api('resumeSession',{token:session});await enterApp(s)}catch(e){showLogin()}}}catch(e){msg('Backend connection failed: '+e.message,'bad')}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
