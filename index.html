<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3768"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>MELVSA Check-In</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#102544}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}.brand{text-align:center}.brand img{width:140px;max-width:45vw}.btn{display:inline-block;border:0;border-radius:12px;background:#0b3768;color:#fff;padding:15px 20px;font-weight:700;font-size:17px}.status{margin:18px 0;padding:14px;border-radius:12px;background:#eef4fb}.ok{background:#eaf8ee}.bad{background:#fff0ed}video{width:100%;border-radius:14px;background:#111;min-height:260px}.small{font-size:13px;color:#607086}</style></head><body><div class="wrap"><div class="card"><div class="brand"><img src="icons/icon-512.png" alt="MELVSA"><h1>MELVSA Check-In</h1><p>Universal Activity QR Scanner — Camera UAT</p></div><div id="status" class="status">Ready for camera test.</div><video id="video" playsinline muted></video><p><button id="start" class="btn">Start Camera</button> <button id="switch" class="btn" style="display:none">Switch Camera</button></p><p class="small">This UAT page tests camera access only. It does not create or modify attendance records.</p></div></div><script>let stream=null,devices=[],idx=0;const v=document.getElementById('video'),s=document.getElementById('status');function msg(t,c=''){s.className='status '+c;s.textContent=t}async function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}async function cameras(){devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');document.getElementById('switch').style.display=devices.length>1?'inline-block':'none'}async function start(id){try{await stop();const constraints={audio:false,video:id?{deviceId:{exact:id}}:{facingMode:{ideal:'environment'}}};stream=await navigator.mediaDevices.getUserMedia(constraints);v.srcObject=stream;await v.play();await cameras();msg('Camera PASS — live video is running.','ok')}catch(e){msg('Camera failed: '+(e.name||'Error')+' — '+(e.message||e),'bad')}}document.getElementById('start').onclick=()=>start();document.getElementById('switch').onclick=async()=>{if(!devices.length)await cameras();idx=(idx+1)%devices.length;start(devices[idx].deviceId)};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
